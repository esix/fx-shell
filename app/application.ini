; This file is YOUR application's metadata. Change Vendor / Name / ID
; to match the app you're building. The fxshell framework code lives
; in ../scripts/ and doesn't need editing.
;
; - Vendor   : your company / author name (shown in About dialogs)
; - Name     : human-readable app name. Surfaces as Services.appinfo.name —
;              the shell window uses it for the title bar and the "Quit <Name>"
;              menu item. The filesystem-safe slug (exe name, profile dir) is
;              separate: fxshell.appName in package.json.
; - Version  : your app's version, not Firefox's
; - BuildID  : YYYYMMDDhhmmss timestamp (arbitrary)
; - ID       : globally unique id, format <name>@<domain-or-local>

[App]
Vendor=My Company
Name=My App
Version=0.1.0
BuildID=20260522
ID=myapp@local

[Gecko]
MinVersion=60.0
MaxVersion=*

[XRE]
EnableProfileMigrator=0
EnableExtensionManager=0
